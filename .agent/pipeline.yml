# generated by agent-pipeline
version: 1
repo: TidalBot
github_repo: hal9ooo/TidalBot
default_branch: main
base_branch: main
labels:
  tier1: ai-fix
  tier2: ai-fix-complex
  working: ai-working
  pr: ai-pr
  blocked: ai-blocked
  unverified: ai-unverified
models:
  tier1:
    provider: opencode/cheaper-inference/deepseek-v4.1-flash
    mode: build
    thinking: xhigh
  tier2:
    provider: codex/gpt-6.1-sol
    mode: full-access
    thinking: high
checks:
  setup:
  - if [ -x .venv/bin/python ] && .venv/bin/python -c 'import sys; raise SystemExit(0
    if sys.version_info[:2] == (3, 11) else 1)'; then :; else uv venv --python 3.11
    --clear .venv; fi
  - uv pip install --python .venv/bin/python -r requirements.txt
  test:
  - python -m unittest discover -s tests -q
runtimes:
  python: '3.11'
  node: '20'
protected_paths:
- .github/workflows/
- .agent/
- scripts/deploy-remote.sh
- .env
- .env.*
- backend/alembic/versions/
allowlist_from_issue: true
limits:
  max_files_changed: 15
  attempts: 2
  timeout_minutes: 45
  verify_timeout_minutes: null
  check_timeout_minutes: 10
  setup_timeout_minutes: 10
  max_output_words: 1200
  max_workers: 1
