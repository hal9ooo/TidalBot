# generated by agent-pipeline
name: CI

on:
  push:
    branches: [main, main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main, main]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15


    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.23"
      - name: Use repository venv
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
        working-directory: .
      - run: if [ -x .venv/bin/python ] && .venv/bin/python -c 'import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 11) else 1)'; then :; else uv venv --python 3.11 --clear .venv; fi
        working-directory: .
      - run: uv pip install --python .venv/bin/python -r requirements.txt
        working-directory: .


      - run: python -m unittest discover -s tests -q
        working-directory: .
