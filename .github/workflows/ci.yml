# generated by agent-pipeline
name: CI

on:
  push:
    branches: [main, main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main, main]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15


    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.23"
      - name: Use repository venv
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
        working-directory: .
      - run: 'true'
        working-directory: .


      - run: 'python -c "raise SystemExit(''No isolated automated test suite: onboarding blocked; see CI-safe backlog'')"'
        working-directory: .
