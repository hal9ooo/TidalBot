# generated by agent-pipeline
name: CI

on:
  push:
    branches: [main, main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main, main]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15


    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.23"
      - name: Use repository venv
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
        working-directory: .
      - run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
        working-directory: .
      - run: python -m unittest discover -s tests -q
        working-directory: .
